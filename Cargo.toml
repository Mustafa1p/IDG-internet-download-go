[package]
name = "idg"
version = "1.4.0"
edition = "2024"

[[bin]]
name = "IDG"
path = "src/main.rs"

[[bin]]
name = "IDG-native"
path = "src/native_host.rs"

[profile.release]
opt-level   = 3
lto         = "thin"
strip       = true
codegen-units = 1

[dependencies]
eframe        = { version = "0.29", features = ["persistence"] }
egui         = "0.29"
egui_extras  = "0.29"
tokio        = { version = "1", features = ["full"] }
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "json"] }
serde        = { version = "1", features = ["derive"] }
anyhow       = "1"
chrono       = "0.4"
uuid         = { version = "1", features = ["v4"] }
futures      = "0.3"
bytes        = "1"
rfd          = "0.14"
dirs         = "5"
arboard = "3.7.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.154"
tempfile = "3"
sha2 = "0.10"
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["cors"] }


[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"
winreg = "0.56"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"
