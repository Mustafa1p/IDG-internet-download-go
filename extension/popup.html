<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDG Integration Module</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif;background:#0e1922;color:#e7f0f7}*{box-sizing:border-box}body{width:284px;margin:0;padding:18px}.status{display:flex;align-items:center;gap:12px}img{width:34px;height:34px}.text{min-width:0}#connection-status{font-size:14px;font-weight:600;line-height:1.5}#connection-detail{margin-top:3px;color:#a6bacb;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.indicator{width:7px;height:7px;background:#f6bd51;border-radius:50%;display:inline-block;margin-right:6px}.connected .indicator{background:#16d3b1}.offline .indicator{background:#f27880}
</style>
<style>
.site{margin-top:16px;padding-top:16px;border-top:1px solid #344858}.site-heading{font-size:12px;color:#a6bacb}#site-host{margin:5px 0 10px;font-size:14px;font-weight:600;overflow-wrap:anywhere}#site-status{font-size:13px;color:#62e0a5;margin-bottom:10px}#site-status.paused{color:#f6bd51}button{width:100%;min-height:44px;border:1px solid #526b7e;border-radius:7px;background:#203746;color:#e7f0f7;font:600 13px "Segoe UI",sans-serif;cursor:pointer}button:hover{background:#2a485b}button:focus-visible{outline:2px solid #62e0a5;outline-offset:3px}button:disabled{opacity:.6;cursor:default}.hint{color:#a6bacb;font-size:12px;line-height:1.5;margin:10px 0 0}
</style>
</head>
<body><main class="status" role="status" aria-live="polite"><img src="images/icon48.png" alt=""><div class="text"><div id="connection-status"><span class="indicator" aria-hidden="true"></span><span id="status-label">Connecting…</span></div><div id="connection-detail">Checking IDG</div></div></main><section class="site" aria-label="Current website"><div class="site-heading">CURRENT WEBSITE</div><div id="site-host">Checking website…</div><div id="site-status" role="status" aria-live="polite"></div><button id="site-toggle" type="button" aria-pressed="false" disabled>Pause on this website</button><p class="hint">Pausing hides IDG buttons and leaves downloads with your browser. Other websites keep working.</p></section><section id="page-check" class="site" hidden><div id="page-status" role="status"></div><button id="page-reload" type="button" hidden>Refresh this page</button><details><summary>Page diagnostics</summary><pre id="page-diagnostics" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px"></pre><button id="copy-diagnostics" type="button">Copy diagnostics</button></details></section><script src="popup.js"></script></body>
</html>
