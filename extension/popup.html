<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDG Integration Module</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif;background:#0e1922;color:#e7f0f7}*{box-sizing:border-box}body{width:284px;margin:0;padding:18px}.status{display:flex;align-items:center;gap:12px}img{width:34px;height:34px}.text{min-width:0}#connection-status{font-size:14px;font-weight:600;line-height:1.5}#connection-detail{margin-top:3px;color:#a6bacb;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.indicator{width:7px;height:7px;background:#f6bd51;border-radius:50%;display:inline-block;margin-right:6px}.connected .indicator{background:#16d3b1}.offline .indicator{background:#f27880}
</style>
</head>
<body><main class="status" role="status" aria-live="polite"><img src="images/icon48.png" alt=""><div class="text"><div id="connection-status"><span class="indicator" aria-hidden="true"></span><span id="status-label">Connecting…</span></div><div id="connection-detail">Checking IDG</div></div></main><script src="popup.js"></script></body>
</html>
