name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --check
      - name: Check warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust regression tests
        run: cargo test --locked --bins
      - name: Extension regression tests
        run: node --test tests/extension.test.cjs
      - name: Signing regression tests
        shell: pwsh
        run: ./tests/signing.test.ps1
      - name: Build release binaries
        run: cargo build --locked --release --bins
      - name: Test update handover
        run: python tests/update-smoke.py
      - name: Cache verified media tools
        uses: actions/cache@v4
        with:
          path: target/media-cache
          key: media-tools-${{ hashFiles('installer/media-tools.json') }}
      - name: Fetch pinned YouTube tools
        run: python installer/fetch-media-tools.py
      - name: Package portable app and extension
        run: python installer/package.py
      - name: Upload tested build
        uses: actions/upload-artifact@v4
        with:
          name: IDG-windows-x64
          path: |
            target/release/IDG.exe
            target/release/IDG-native.exe
            target/release/tools/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: windows-release
    permissions:
      contents: write
      id-token: write
    env:
      IDG_SIGNING_ENDPOINT: ${{ vars.IDG_SIGNING_ENDPOINT }}
      IDG_SIGNING_ACCOUNT: ${{ vars.IDG_SIGNING_ACCOUNT }}
      IDG_SIGNING_PROFILE: ${{ vars.IDG_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Require release signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          foreach ($name in 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'IDG_SIGNING_ENDPOINT', 'IDG_SIGNING_ACCOUNT', 'IDG_SIGNING_PROFILE') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name. Configure windows-release; see docs/windows-signing.md. No unsigned release will be published." }
          }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare signing client
        shell: pwsh
        run: ./installer/prepare-signing.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: IDG-windows-x64
          path: target/release
      - name: Sign and verify application and bundled tools
        shell: pwsh
        run: ./installer/sign-windows.ps1 -Path target/release/IDG.exe, target/release/IDG-native.exe, target/release/tools, installer/register-native-host.ps1
      - name: Validate release version and prepare assets
        shell: pwsh
        run: |
          python installer/package.py "${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { throw "Release version validation failed" }
      - name: Find Inno Setup
        shell: pwsh
        run: |
          $compiler = @("C:/Program Files (x86)/Inno Setup 6/ISCC.exe", "C:/Program Files/Inno Setup 6/ISCC.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup" }
            $compiler = @("C:/Program Files (x86)/Inno Setup 6/ISCC.exe", "C:/Program Files/Inno Setup 6/ISCC.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw "Inno Setup compiler not found" }
          "IDG_ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Build Windows installer
        shell: pwsh
        run: |
          $signer = Join-Path $env:GITHUB_WORKSPACE 'installer/sign-windows.ps1'
          $signCommand = 'pwsh.exe -NoProfile -NonInteractive -File $q' + $signer + '$q -Path $f'
          & $env:IDG_ISCC '/DIDG_SIGN_RELEASE' "/Sidg=$signCommand" installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          $version = "${{ github.ref_name }}".TrimStart('v')
          Move-Item -LiteralPath "dist/IDG-Setup-$version.exe" -Destination "dist/IDG-Setup-${{ github.ref_name }}.exe"
      - name: Verify final installer signature
        shell: pwsh
        run: ./installer/sign-windows.ps1 -VerifyOnly -Path "dist/IDG-Setup-${{ github.ref_name }}.exe"
      - name: Verify assets and create checksums
        run: python installer/checksums.py "${{ github.ref_name }}"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "IDG ${{ github.ref_name }}"
          body_path: docs/release-notes.md
          files: |
            dist/IDG-Setup-${{ github.ref_name }}.exe
            dist/IDG-extension-${{ github.ref_name }}.zip
            dist/IDG-portable-${{ github.ref_name }}.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
