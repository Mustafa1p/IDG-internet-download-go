name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test and build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            build_dir: target/release
            cargo_args: ''
          - arch: x86
            target: i686-pc-windows-msvc
            build_dir: target/i686-pc-windows-msvc/release
            cargo_args: '--target i686-pc-windows-msvc'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --check
      - name: Check warnings
        run: cargo clippy --locked ${{ matrix.cargo_args }} --all-targets -- -D warnings
      - name: Rust regression tests
        run: cargo test --locked ${{ matrix.cargo_args }} --bins
      - name: Extension regression tests
        run: node --test tests/extension.test.cjs
      - name: Signing regression tests
        shell: pwsh
        run: ./tests/signing.test.ps1
      - name: Build release binaries
        run: cargo build --locked --release --bins ${{ matrix.cargo_args }}
      - name: Test update handover
        run: python tests/update-smoke.py "${{ matrix.build_dir }}/IDG-native.exe"
      - name: Cache verified media tools
        uses: actions/cache@v4
        with:
          path: target/media-cache
          key: media-tools-${{ hashFiles('installer/media-tools*.json') }}
      - name: Fetch pinned YouTube tools
        run: python installer/fetch-media-tools.py ${{ matrix.arch }}
      - name: Package portable app and extension
        run: python installer/package.py ${{ matrix.arch }}
      - name: Upload tested build
        uses: actions/upload-artifact@v4
        with:
          name: IDG-windows-${{ matrix.arch }}
          path: |
            ${{ matrix.build_dir }}/IDG.exe
            ${{ matrix.build_dir }}/IDG-native.exe
            ${{ matrix.build_dir }}/tools/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: windows-release
    permissions:
      contents: write
      id-token: write
    env:
      IDG_SIGN_RELEASE: ${{ vars.IDG_SIGN_RELEASE || 'false' }}
      IDG_SIGNING_ENDPOINT: ${{ vars.IDG_SIGNING_ENDPOINT }}
      IDG_SIGNING_ACCOUNT: ${{ vars.IDG_SIGNING_ACCOUNT }}
      IDG_SIGNING_PROFILE: ${{ vars.IDG_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Require release signing configuration
        if: env.IDG_SIGN_RELEASE == 'true'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          foreach ($name in 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'IDG_SIGNING_ENDPOINT', 'IDG_SIGNING_ACCOUNT', 'IDG_SIGNING_PROFILE') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name. Configure windows-release; see docs/windows-signing.md. No unsigned release will be published." }
          }
      - uses: azure/login@v2
        if: env.IDG_SIGN_RELEASE == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-dotnet@v4
        if: env.IDG_SIGN_RELEASE == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Prepare signing client
        if: env.IDG_SIGN_RELEASE == 'true'
        shell: pwsh
        run: ./installer/prepare-signing.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: IDG-windows-x64
          path: target/release
      - uses: actions/download-artifact@v4
        with:
          name: IDG-windows-x86
          path: target/i686-pc-windows-msvc/release
      - name: Sign and verify application and bundled tools
        if: env.IDG_SIGN_RELEASE == 'true'
        shell: pwsh
        run: ./installer/sign-windows.ps1 -Path target/release/IDG.exe, target/release/IDG-native.exe, target/release/tools, target/i686-pc-windows-msvc/release/IDG.exe, target/i686-pc-windows-msvc/release/IDG-native.exe, target/i686-pc-windows-msvc/release/tools, installer/register-native-host.ps1
      - name: Validate release version and prepare assets
        shell: pwsh
        run: |
          python installer/package.py "${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { throw "Release version validation failed" }
          python installer/package.py "${{ github.ref_name }}" x86
          if ($LASTEXITCODE -ne 0) { throw "x86 packaging failed" }
      - name: Find Inno Setup
        shell: pwsh
        run: |
          $compiler = @("C:/Program Files (x86)/Inno Setup 6/ISCC.exe", "C:/Program Files/Inno Setup 6/ISCC.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup" }
            $compiler = @("C:/Program Files (x86)/Inno Setup 6/ISCC.exe", "C:/Program Files/Inno Setup 6/ISCC.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw "Inno Setup compiler not found" }
          "IDG_ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Build Windows installer
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'x86') {
            $options = @()
            if ($arch -eq 'x86') { $options += '/DPackageArch=x86', '/DPackageSuffix=-x86', '/DBuildDir=..\target\i686-pc-windows-msvc\release' }
            if ($env:IDG_SIGN_RELEASE -eq 'true') {
              $signer = Join-Path $env:GITHUB_WORKSPACE 'installer/sign-windows.ps1'
              $signCommand = 'pwsh.exe -NoProfile -NonInteractive -File $q' + $signer + '$q -Path $f'
              $options += '/DIDG_SIGN_RELEASE', "/Sidg=$signCommand"
            }
            & $env:IDG_ISCC @options installer/setup.iss
            if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed for $arch" }
          }
      - name: Verify final installer signature
        if: env.IDG_SIGN_RELEASE == 'true'
        shell: pwsh
        run: ./installer/sign-windows.ps1 -VerifyOnly -Path "dist/IDG-Setup-${{ github.ref_name }}.exe", "dist/IDG-Setup-${{ github.ref_name }}-x86.exe"
      - name: Verify assets and create checksums
        run: python installer/checksums.py "${{ github.ref_name }}"
      - name: Prepare release notes
        shell: pwsh
        run: |
          $notes = Get-Content -LiteralPath docs/release-notes.md -Raw
          if ($env:IDG_SIGN_RELEASE -ne 'true') {
            $notes = "**Windows signing status:** This release is unsigned. Windows may display an unknown-publisher or SmartScreen warning.`n`n" + $notes
          }
          Set-Content -LiteralPath target/release-notes.md -Value $notes -Encoding utf8
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "IDG ${{ github.ref_name }}"
          body_path: target/release-notes.md
          files: |
            dist/IDG-Setup-${{ github.ref_name }}.exe
            dist/IDG-Setup-${{ github.ref_name }}-x86.exe
            dist/IDG-portable-${{ github.ref_name }}-x86.zip
            dist/IDG-extension-${{ github.ref_name }}.zip
            dist/IDG-portable-${{ github.ref_name }}.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
